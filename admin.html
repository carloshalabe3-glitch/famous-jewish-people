<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Famous Jewish People</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
</head>
<body>

  <header class="masthead">
    <div class="masthead-top">
      <span class="masthead-date" id="masthead-date"></span>
      <span class="masthead-tagline">Admin Panel</span>
    </div>
    <div class="masthead-title">
      <span class="star">✡</span>
      <h1><a href="index.html">Famous Jewish People</a></h1>
      <span class="star">✡</span>
    </div>
    <nav class="masthead-nav">
      <a href="index.html" class="nav-link">← View Site</a>
      <span class="nav-link nav-label">Admin</span>
      <button id="logout-btn" class="nav-link nav-btn" onclick="logout()" hidden>Logout</button>
    </nav>
  </header>

  <!-- ── Login ── -->
  <div id="login-panel" class="admin-panel" hidden>
    <div class="admin-box">
      <h2 class="admin-box-title">Connect to GitHub</h2>
      <p class="admin-box-sub">
        Your posts are saved as files in a GitHub repo. Vercel deploys them automatically.<br>
        <a href="https://github.com/settings/tokens/new?scopes=repo&description=FamousJewishPeople" target="_blank">Create a GitHub token →</a>
      </p>
      <form id="login-form">
        <div class="field">
          <label>GitHub Personal Access Token</label>
          <input type="password" name="token" placeholder="ghp_..." required autocomplete="off">
        </div>
        <div class="field-row">
          <div class="field">
            <label>GitHub Username / Org</label>
            <input type="text" name="owner" placeholder="your-username" required>
          </div>
          <div class="field">
            <label>Repository Name</label>
            <input type="text" name="repo" placeholder="famous-jewish-people" required>
          </div>
        </div>
        <div class="field">
          <label>Branch</label>
          <input type="text" name="branch" placeholder="main" value="main">
        </div>
        <p id="login-error" class="field-error" hidden></p>
        <button type="submit" class="btn-primary" id="login-btn">Connect</button>
      </form>
    </div>
  </div>

  <!-- ── Dashboard ── -->
  <div id="dashboard" class="admin-panel" hidden>
    <div class="admin-toolbar">
      <h2 class="admin-section-title">All Posts</h2>
      <button class="btn-primary" onclick="newPost()">+ New Post</button>
    </div>
    <div id="posts-list"></div>
  </div>

  <!-- ── Editor ── -->
  <div id="editor-panel" class="admin-panel" hidden>
    <div class="admin-toolbar">
      <button class="btn-back" onclick="showDashboard()">← All Posts</button>
      <div id="editor-status"></div>
    </div>
    <form id="editor-form">
      <div class="editor-meta-grid">
        <div class="field field-wide">
          <label>Title</label>
          <input type="text" id="edit-title" placeholder="Full name and tagline" required>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="edit-category">
            <option>Athletes</option>
            <option>Entertainment</option>
            <option>Music</option>
            <option>Business</option>
            <option>Content Creators</option>
            <option>Science &amp; History</option>
          </select>
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="edit-date" required>
        </div>
        <div class="field field-wide">
          <label>Excerpt <span class="label-hint">(shown on homepage)</span></label>
          <textarea id="edit-excerpt" rows="2" placeholder="One or two sentences about this person..." required></textarea>
        </div>
        <div class="field field-check">
          <label class="check-label">
            <input type="checkbox" id="edit-featured">
            Feature this post at the top of the homepage
          </label>
        </div>
      </div>

      <div class="field">
        <label>Article Body <span class="label-hint">(Markdown)</span></label>
        <textarea id="edit-content"></textarea>
      </div>

      <div class="editor-footer">
        <button type="button" class="btn-secondary" onclick="showDashboard()">Cancel</button>
        <button type="submit" class="btn-primary" id="save-btn">Save &amp; Publish</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
